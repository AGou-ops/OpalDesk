<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Studio Shadows -->
    <filter id="chassisShadow" x="-12%" y="-10%" width="124%" height="126%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#030716" flood-opacity="0.46"/>
    </filter>
    <filter id="backPaneShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04091B" flood-opacity="0.34"/>
    </filter>
    <filter id="frontPaneShadow" x="-18%" y="-16%" width="136%" height="142%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#030819" flood-opacity="0.44"/>
    </filter>
    <filter id="dockShadow" x="-16%" y="-26%" width="132%" height="164%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#030818" flood-opacity="0.38"/>
    </filter>

    <!-- Obsidian-Sapphire Opal Backdrop -->
    <linearGradient id="opalBase" x1="60" y1="44" x2="452" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E162D"/>
      <stop offset="52%" stop-color="#18264B"/>
      <stop offset="100%" stop-color="#101B38"/>
    </linearGradient>

    <radialGradient id="auroraCyan" cx="388" cy="118" r="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ED6EB" stop-opacity="0.66"/>
      <stop offset="48%" stop-color="#2997FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2ED6EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraViolet" cx="136" cy="364" r="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F6BFA" stop-opacity="0.60"/>
      <stop offset="50%" stop-color="#5E7CE2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7F6BFA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPearl" cx="364" cy="396" r="206" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F285C7" stop-opacity="0.34"/>
      <stop offset="56%" stop-color="#C084FC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F285C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chassisRim" x1="48" y1="42" x2="464" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="36%" stop-color="#7DD3FC" stop-opacity="0.46"/>
      <stop offset="72%" stop-color="#818CF8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.48"/>
    </linearGradient>

    <!-- Back Frosted Secondary Window -->
    <linearGradient id="backGlassFill" x1="94" y1="112" x2="294" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94E6FA" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#598FF0" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Front Main Liquid Glass Window -->
    <linearGradient id="frontGlassFill" x1="154" y1="128" x2="424" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4FAFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#C2E0FC" stop-opacity="0.76"/>
    </linearGradient>

    <linearGradient id="frontSheen" x1="289" y1="128" x2="289" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="frontRim" x1="154" y1="128" x2="424" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#BAE6FD" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.78"/>
    </linearGradient>

    <!-- Inner Split Tiles -->
    <linearGradient id="tilePrimary" x1="176" y1="184" x2="306" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#248AF5" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#1ABDD1" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="tileSecondary" x1="319" y1="184" x2="402" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#756BF0" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#5E7CE2" stop-opacity="0.64"/>
    </linearGradient>

    <!-- Floating Liquid Glass Dock -->
    <linearGradient id="dockFill" x1="140" y1="366" x2="372" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#D6EAFF" stop-opacity="0.46"/>
    </linearGradient>

    <clipPath id="chassisClip">
      <rect x="47" y="42" width="418" height="418" rx="94.5"/>
    </clipPath>
    <clipPath id="frontClip">
      <rect x="154" y="130" width="268" height="218" rx="42"/>
    </clipPath>
  </defs>

  <!-- Chassis Drop Shadow -->
  <g filter="url(#chassisShadow)">
    <rect x="47" y="42" width="418" height="418" rx="94.5" fill="#0B1328"/>
  </g>

  <!-- Inside Opal Squircle Chassis -->
  <g clip-path="url(#chassisClip)">
    <rect x="47" y="42" width="418" height="418" fill="url(#opalBase)"/>
    <circle cx="388" cy="118" r="275" fill="url(#auroraCyan)"/>
    <circle cx="136" cy="364" r="265" fill="url(#auroraViolet)"/>
    <circle cx="364" cy="396" r="206" fill="url(#auroraPearl)"/>

    <!-- Inner Bevel Cushion -->
    <rect x="51" y="46" width="410" height="410" rx="90.5" stroke="url(#chassisRim)" stroke-width="5" opacity="0.38"/>

    <!-- Back Frosted Secondary Window (Multi-Window Virtual Display Depth) -->
    <g filter="url(#backPaneShadow)">
      <rect x="92" y="108" width="198" height="172" rx="34" fill="url(#backGlassFill)"/>
    </g>
    <rect x="92" y="108" width="198" height="172" rx="34" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="3.2"/>
    <circle cx="122" cy="136" r="6" fill="#FFFFFF" fill-opacity="0.58"/>
    <circle cx="142" cy="136" r="6" fill="#FFFFFF" fill-opacity="0.36"/>
    <rect x="116" y="162" width="84" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="116" y="186" width="122" height="68" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>

    <!-- Front Main Liquid Glass Desktop Window -->
    <g filter="url(#frontPaneShadow)">
      <rect x="154" y="130" width="268" height="218" rx="42" fill="url(#frontGlassFill)"/>
    </g>
    <g clip-path="url(#frontClip)">
      <rect x="154" y="130" width="268" height="84" fill="url(#frontSheen)"/>
      <!-- macOS Window Traffic Lights -->
      <circle cx="187" cy="161" r="7.5" fill="#FA6870"/>
      <circle cx="209" cy="161" r="7.5" fill="#FCBC40"/>
      <circle cx="231" cy="161" r="7.5" fill="#3DD17A"/>
      <!-- Title Pill -->
      <rect x="266" y="154" width="64" height="14" rx="7" fill="#1E293B" fill-opacity="0.14"/>

      <!-- Split-Tiling Content Cards inside Main Window -->
      <rect x="176" y="184" width="124" height="142" rx="20" fill="url(#tilePrimary)"/>
      <rect x="192" y="202" width="64" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.46"/>
      <rect x="192" y="224" width="92" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
      <rect x="192" y="294" width="52" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.34"/>

      <rect x="314" y="184" width="86" height="78" rx="18" fill="url(#tileSecondary)"/>
      <rect x="314" y="274" width="86" height="52" rx="16" fill="#334D80" fill-opacity="0.22"/>
    </g>
    <rect x="154" y="130" width="268" height="218" rx="42" stroke="url(#frontRim)" stroke-width="4.2"/>

    <!-- Floating Liquid Glass Dock Capsule -->
    <g filter="url(#dockShadow)">
      <rect x="139" y="368" width="234" height="50" rx="25" fill="url(#dockFill)"/>
    </g>
    <rect x="139" y="368" width="234" height="50" rx="25" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="3"/>

    <!-- 4 Luminous Opal App Gems in Dock -->
    <rect x="171" y="380" width="26" height="26" rx="9" fill="#249EFC"/>
    <rect x="219" y="380" width="26" height="26" rx="9" fill="#24CCC7"/>
    <rect x="267" y="380" width="26" height="26" rx="9" fill="#8F70FA"/>
    <rect x="315" y="380" width="26" height="26" rx="9" fill="#F57AB8"/>
  </g>

  <!-- Outer Studio Hairline Rim -->
  <rect x="47" y="42" width="418" height="418" rx="94.5" stroke="url(#chassisRim)" stroke-width="3.2"/>
</svg>
